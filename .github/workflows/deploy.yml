name: Deploy to GCP VM

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via SSH
        run: |
          gcloud compute ssh kavin@tracetech-instance \
            --project=stone-outpost-472905-f8 \
            --zone=us-central1-f \
            --command="
              sudo git config --global --add safe.directory /home/kavin_charles/atp-crm &&
              sudo -u kavin_charles git -C /home/kavin_charles/atp-crm pull origin master &&
              sudo -u kavin_charles bash -c 'cd /home/kavin_charles/atp-crm/backend && npm install' &&
              sudo -u kavin_charles bash -c 'cd /home/kavin_charles/atp-crm/frontend && npm install' &&
              sudo -u kavin_charles bash -c 'cd /home/kavin_charles/atp-crm && npm run build' &&
              sudo fuser -k 3001/tcp 2>/dev/null || true &&
              sleep 2 &&
              cd /home/kavin_charles/atp-crm && sudo -u kavin_charles nohup npm start </dev/null >/tmp/atp-crm.log 2>&1 &
            "
