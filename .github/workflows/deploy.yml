name: Deploy to GCP VM

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "Starting deployment on GCP VM..."
            
            TARGET_DIR="/home/${{ secrets.VM_USERNAME }}/atp-crm"
            if [ ! -d "$TARGET_DIR" ]; then
              git clone https://github.com/Kavin-Charles/atp-crm.git "$TARGET_DIR"
            fi
            cd "$TARGET_DIR"
            
            echo "Fetching latest repository code..."
            git fetch origin
            git reset --hard origin/master || git reset --hard origin/main
            
            echo "Retrieving environment variables from GCP Metadata..."
            MONGO_URI=$(curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/attributes/MONGO_URI")
            SESSION_SECRET=$(curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/attributes/SESSION_SECRET")
            PORT=$(curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/attributes/PORT" || echo "3001")
            NODE_ENV=$(curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/attributes/NODE_ENV" || echo "production")
            
            if [ -z "$MONGO_URI" ]; then
              MONGO_URI="mongodb+srv://KavinCharlie:jaya2005@cluster0.xaxng.mongodb.net/atp_crm"
            fi
            if [ -z "$SESSION_SECRET" ]; then
              SESSION_SECRET="atp_crm_prod_secret_2026"
            fi
            
            echo "MONGO_URI=${MONGO_URI}" > backend/.env
            echo "SESSION_SECRET=${SESSION_SECRET}" >> backend/.env
            echo "PORT=${PORT}" >> backend/.env
            echo "NODE_ENV=${NODE_ENV}" >> backend/.env
            
            echo "Building Docker container image..."
            sudo docker build -t atp-crm:latest .
            
            echo "Deploying container..."
            sudo docker rm -f atp-crm || true
            sudo docker run -d \
              --name atp-crm \
              --restart unless-stopped \
              -p 80:${PORT} \
              -e MONGO_URI="${MONGO_URI}" \
              -e SESSION_SECRET="${SESSION_SECRET}" \
              -e PORT="${PORT}" \
              -e NODE_ENV="${NODE_ENV}" \
              atp-crm:latest
            
            sudo docker image prune -f || true
            echo "✓ Deployment to tracetech-instance completed successfully!"
